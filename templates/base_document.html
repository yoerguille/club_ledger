{% load static %}
{% load tailwind_tags %}

<!DOCTYPE html>
<html lang="es">

<head>
    {% tailwind_css %}
    <meta charset="UTF-8">

    <title>

        {% block title %}

        Estado de Cuenta . {{customer.name}}

        {% endblock %}

    </title>

    <link rel="stylesheet" href="{% static 'css/print.css' %}">
    {% block extra_css %}
    {% endblock %}

   <style>

        @media print {

            .no-print {
                display: none !important;
            }

            body {
                background: white;
            }

            main {
                margin: 0 !important;

                width: 100%;

                max-width: none;

                box-shadow: none;

            }

            tr {

                page-break-inside: avoid;

            }

            .grid {

                break-inside: avoid;

            }

            
        }

    

    </style>
   
</head>

<body class="bg-gray-100">

    <div class="no-print border-b border-gray-200 bg-white">

        <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">

            <div>

                {% block document_back %}
                {% endblock %}

            </div>

            <div class="flex items-center gap-3">

                {% block document_actions %}
                {% endblock %}

            </div>

        </div>

    </div>

    <main class="mx-auto my-10 max-w-5xl bg-white shadow-lg">

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
