{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Club Ledger
        {% endblock %}
    </title>

    <!-- Tailwind / estilos generales -->
    <link
        rel="stylesheet"
        href="{% static 'css/output.css' %}"
    >

    <!-- Sistema de documentos -->
    <link
        rel="stylesheet"
        href="{% static 'css/documents.css' %}"
    >

    <!-- Impresión y PDF -->
    <link
        rel="stylesheet"
        href="{% static 'css/print.css' %}"
        media="print"
    >

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <!-- ===================================================== -->
    <!-- BARRA DE ACCIONES -->
    <!-- Solo visible en pantalla -->
    <!-- ===================================================== -->

    <div class="document-toolbar no-print">

        <div class="document-toolbar__container">

            <div class="document-toolbar__back">

                {% block document_back %}
                {% endblock %}

            </div>

            <div class="document-toolbar__actions">

                {% block document_actions %}
                {% endblock %}

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- DOCUMENTO -->
    <!-- ===================================================== -->

    <main class="document-page">

        <article class="document">

            {% block content %}
            {% endblock %}

        </article>

    </main>


</body>

</html>
