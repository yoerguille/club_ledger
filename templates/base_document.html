{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Club Ledger
        {% endblock %}
    </title>

    <!-- Tailwind -->
    <link rel="stylesheet" href="{% static 'css/output.css' %}">

    <!-- Estilos propios de los documentos -->
    <link rel="stylesheet" href="{% static 'css/documents.css' %}">

    <!-- Estilos específicos de impresión -->
    <link rel="stylesheet" href="{% static 'css/print.css' %}" media="print">

    {% block extra_css %}
    {% endblock %}

</head>

<body class="bg-gray-100">

    <!-- ===================================================== -->
    <!-- Barra de acciones (solo visible en pantalla) -->
    <!-- ===================================================== -->

    <div class="document-toolbar no-print">

        <div class="document-toolbar__container">

            <div>

                {% block document_back %}
                {% endblock %}

            </div>

            <div class="document-toolbar__actions">

                {% block document_actions %}
                {% endblock %}

            </div>

        </div>

    </div>

    <!-- ===================================================== -->
    <!-- Documento -->
    <!-- ===================================================== -->

    <main>

        <article class="document">

            {% block content %}
            {% endblock %}

        </article>

    </main>

</body>

</html>
