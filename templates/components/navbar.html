
<header class="border-b border-gray-200 bg-white
               dark:border-zinc-800 dark:bg-dark-primary">

    <div class="flex min-h-16 items-center justify-between gap-4 px-6 py-4 lg:px-8">

        <!-- Título de la página -->
        <h2 class="truncate text-xl font-semibold tracking-tight
                   text-gray-900 dark:text-white">

            {% block page_title %}
                Dashboard
            {% endblock %}

        </h2>

        <!-- Acciones -->
        <div class="flex shrink-0 items-center gap-3 sm:gap-4">

            <!-- Cambiar tema -->
            <button
                id="theme-toggle"
                type="button"
                aria-label="Cambiar tema"
                class="inline-flex h-9 w-9 items-center justify-center
                       rounded-lg border border-gray-200
                       bg-gray-50 text-gray-600
                       transition-colors duration-200
                       hover:border-blue-300 hover:bg-blue-50
                       hover:text-btn-primary
                       focus-visible:outline-2
                       focus-visible:outline-offset-2
                       focus-visible:outline-btn-primary
                       dark:border-zinc-700
                       dark:bg-dark-secondary
                       dark:text-gray-300
                       dark:hover:border-btn-primary
                       dark:hover:bg-dark-tertiary
                       dark:hover:text-btn-primary"
            >
                <span id="theme-toggle-icon" class="text-lg leading-none">
                    ☾
                </span>
            </button>

            {% if user.is_authenticated %}

                <!-- Separador -->
                <div class="hidden h-8 w-px bg-gray-200
                            dark:bg-zinc-800 sm:block"></div>

                <!-- Usuario -->
                <div class="hidden text-right sm:block">

                    <p class="text-sm font-medium text-gray-900 dark:text-white">
                        {{ user.get_username }}
                    </p>

                    <div class="mt-0.5 flex items-center justify-end gap-1.5">
                        <span class="h-1.5 w-1.5 rounded-full
                                     bg-emerald-500"></span>

                        <p class="text-xs text-gray-500 dark:text-secondary">
                            Sesión activa
                        </p>
                    </div>

                </div>

                <!-- Cerrar sesión -->
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}

                    <button
                        type="submit"
                        class="inline-flex h-9 items-center justify-center
                               whitespace-nowrap rounded-lg
                               border border-gray-200
                               bg-white px-3 text-sm font-medium
                               text-gray-700
                               transition-colors duration-200
                               hover:border-red-200 hover:bg-red-50
                               hover:text-red-600
                               focus-visible:outline-2
                               focus-visible:outline-offset-2
                               focus-visible:outline-btn-primary
                               dark:border-zinc-700
                               dark:bg-dark-secondary
                               dark:text-gray-300
                               dark:hover:border-red-900
                               dark:hover:bg-red-950/30
                               dark:hover:text-red-400"
                    >
                        Cerrar sesión
                    </button>

                </form>

            {% endif %}

        </div>

    </div>

</header>
