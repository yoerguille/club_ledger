
<aside class="flex min-h-screen w-56 shrink-0 flex-col
              border-r border-gray-200 bg-white
              dark:border-zinc-800 dark:bg-dark-secondary">

    <!-- Logotipo -->
    <div class="flex h-20 items-center border-b border-gray-200
                px-5 dark:border-zinc-800">

        {% load static %}

        <a href="{% url 'dashboard:dashboard' %}"
        class="flex items-center gap-3">

            <img
                src="{% static 'img/brand/club-ledger-icon.png' %}"
                alt=""
                class="h-9 w-9 object-contain"
            >

            <span class="font-sans text-lg font-bold
                        tracking-tight text-gray-950
                        dark:text-white">
                Club Ledger
            </span>

        </a>

    </div>

    {% if user.is_authenticated %}

        <!-- Navegación -->
        <nav class="flex-1 space-y-1 px-3 py-6">

            <p class="mb-3 px-3 text-xs font-semibold uppercase
                      tracking-wider text-gray-400 dark:text-secondary">
                Principal
            </p>

            <!-- Dashboard -->
            <a href="{% url 'dashboard:dashboard' %}"
               class="flex items-center gap-3 rounded-lg px-3 py-2.5
                      text-sm font-medium transition-colors duration-200
                      {% if request.resolver_match.app_name == 'dashboard' %}
                          bg-blue-50 text-btn-primary
                          dark:bg-btn-primary/15 dark:text-blue-400
                      {% else %}
                          text-gray-600 hover:bg-gray-100 hover:text-gray-900
                          dark:text-gray-400 dark:hover:bg-dark-tertiary
                          dark:hover:text-white
                      {% endif %}">

                <svg class="h-5 w-5 shrink-0" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     viewBox="0 0 24 24">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>

                <span>Dashboard</span>
            </a>

            <!-- Clientes -->
            <a href="{% url 'customers:customer_list' %}"
               class="flex items-center gap-3 rounded-lg px-3 py-2.5
                      text-sm font-medium transition-colors duration-200
                      {% if request.resolver_match.app_name == 'customers' %}
                          bg-blue-50 text-btn-primary
                          dark:bg-btn-primary/15 dark:text-blue-400
                      {% else %}
                          text-gray-600 hover:bg-gray-100 hover:text-gray-900
                          dark:text-gray-400 dark:hover:bg-dark-tertiary
                          dark:hover:text-white
                      {% endif %}">

                <svg class="h-5 w-5 shrink-0" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>

                <span>Clientes</span>
            </a>

            <!-- Cuentas -->
            <a href="{% url 'accounts:account_list' %}"
               class="flex items-center gap-3 rounded-lg px-3 py-2.5
                      text-sm font-medium transition-colors duration-200
                      {% if request.resolver_match.app_name == 'accounts' %}
                          bg-blue-50 text-btn-primary
                          dark:bg-btn-primary/15 dark:text-blue-400
                      {% else %}
                          text-gray-600 hover:bg-gray-100 hover:text-gray-900
                          dark:text-gray-400 dark:hover:bg-dark-tertiary
                          dark:hover:text-white
                      {% endif %}">

                <svg class="h-5 w-5 shrink-0" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     viewBox="0 0 24 24">
                    <rect x="3" y="5" width="18" height="15" rx="2"/>
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M3 10h18M7 15h4"/>
                </svg>

                <span>Cuentas</span>
            </a>

            <!-- Temporadas -->
            <a href="{% url 'seasons:season_list' %}"
               class="flex items-center gap-3 rounded-lg px-3 py-2.5
                      text-sm font-medium transition-colors duration-200
                      {% if request.resolver_match.app_name == 'seasons' %}
                          bg-blue-50 text-btn-primary
                          dark:bg-btn-primary/15 dark:text-blue-400
                      {% else %}
                          text-gray-600 hover:bg-gray-100 hover:text-gray-900
                          dark:text-gray-400 dark:hover:bg-dark-tertiary
                          dark:hover:text-white
                      {% endif %}">

                <svg class="h-5 w-5 shrink-0" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     viewBox="0 0 24 24">
                    <rect x="3" y="5" width="18" height="16" rx="2"/>
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M16 3v4M8 3v4M3 10h18"/>
                </svg>

                <span>Temporadas</span>
            </a>

        </nav>

    {% endif %}

    <!-- Pie de sidebar -->
    <div class="border-t border-gray-200 px-5 py-4
                dark:border-zinc-800">

        <p class="text-xs text-gray-400 dark:text-secondary">
            Club Ledger
        </p>

        <p class="mt-1 text-xs text-gray-400 dark:text-secondary">
            Gestión de cuentas deportivas
        </p>

    </div>

</aside>
