
<div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm
            transition-colors hover:border-gray-300
            dark:border-white/10 dark:bg-dark-primary
            dark:hover:border-white/20">

    <!-- Cabecera -->
    <div class="flex items-center justify-between gap-3">

        <div class="flex min-w-0 items-center gap-3">

            <!-- Icono -->
            <div class="flex h-11 w-11 shrink-0 items-center
                        justify-center rounded-lg bg-gray-100
                        dark:bg-dark-secondary">

                <svg xmlns="http://www.w3.org/2000/svg"
                     class="h-5 w-5 text-gray-600 dark:text-gray-300"
                     fill="none" viewBox="0 0 24 24"
                     stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/>
                </svg>

            </div>

            <!-- Temporada y fechas -->
            <div class="min-w-0">

                <h3 class="truncate text-base font-semibold
                           text-gray-900 dark:text-white">
                    {{ season.name }}
                </h3>

                <p class="mt-1 text-xs text-gray-500
                          dark:text-secondary">
                    {{ season.start_date|date:"d M Y" }}
                    –
                    {{ season.end_date|date:"d M Y" }}
                </p>

            </div>
        </div>

        <!-- Estado -->
        {% if season.is_active %}
            <span class="inline-flex shrink-0 items-center
                         rounded-full bg-green-100 px-2.5 py-1
                         text-xs font-medium text-green-700
                         dark:bg-green-900/30 dark:text-green-400">
                Activa
            </span>
        {% else %}
            <span class="inline-flex shrink-0 items-center
                         rounded-full bg-gray-100 px-2.5 py-1
                         text-xs font-medium text-gray-600
                         dark:bg-dark-secondary dark:text-secondary">
                Inactiva
            </span>
        {% endif %}

    </div>

    <!-- Pie -->
    <div class="mt-4 flex items-center justify-between
                border-t border-gray-100 pt-3
                dark:border-white/10">

        <!-- Número de cuentas -->
        <div class="flex items-center gap-2
                    text-sm text-gray-500 dark:text-secondary">

            <svg xmlns="http://www.w3.org/2000/svg"
                 class="h-4 w-4"
                 fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m14-14a4 4 0 1 1 0 8M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/>
            </svg>

            <span>
                {{ season.accounts.count }}
                cuentas{{ season.account.count|pluralize }}
            </span>

        </div>

        <!-- Acción -->
        {% comment %}
            <a href="{% url 'seasons:season_detail' season.pk %}"
            class="inline-flex items-center gap-1
                    text-sm font-medium text-btn-primary
                    transition-colors hover:underline
                    focus-visible:rounded-sm focus-visible:outline
                    focus-visible:outline-2
                    focus-visible:outline-offset-2
                    focus-visible:outline-btn-primary">

                Consultar

                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-4 w-4"
                    fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round"
                        stroke-linejoin="round"
                        d="m9 18 6-6-6-6"/>
                </svg>
            </a>
        {% endcomment %}
        

    </div>

</div>
