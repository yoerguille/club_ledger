<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 dark:bg-gray-900">

    <p class="text-sm font-medium text-gray-500 dark:text-gray-200">
        {{ title }}
    </p>

    <h2 class="mt-2 text-3xl font-bold text-gray-900 dark:text-white">
        {{ value }} 
    </h2>

    {% if subtitle %}
    <p class="mt-2 text-xs text-gray-500 dark:text-gray-200">
        {{ subtitle }}
    </p>
    {% endif %}

</div>
