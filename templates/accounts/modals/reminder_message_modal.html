<!-- MODAL DE MENSAJE -->
<!-- ================================================= -->
    {% for reminder in collection_reminders %}

        <div
            id="reminder-modal-{{ reminder.pk }}"
            tabindex="-1"
            aria-hidden="true"
            class="fixed inset-0 z-50 hidden h-full w-full
                items-center justify-center overflow-y-auto
                overflow-x-hidden bg-gray-900/50 p-4"
        >

            <div class="relative w-full max-w-2xl">

                <div class="relative rounded-lg bg-white shadow
                            dark:bg-gray-800">

                    <!-- Cabecera -->
                    <div class="flex items-center justify-between
                                border-b border-gray-200 p-5
                                dark:border-gray-700">

                        <h3 class="text-lg font-semibold
                                text-gray-900 dark:text-white">
                            Recordatorio enviado
                        </h3>

                        <button
                            type="button"
                            data-modal-hide="reminder-modal-{{ reminder.pk }}"
                            class="rounded-lg p-2 text-gray-400
                                hover:bg-gray-100 hover:text-gray-900
                                dark:hover:bg-gray-700 dark:hover:text-white"
                        >
                            ✕
                            <span class="sr-only">Cerrar modal</span>
                        </button>

                    </div>

                    <!-- Información -->
                    <div class="space-y-4 p-6">

                        <div class="text-sm text-gray-500 dark:text-gray-400">
                            <p>
                                <strong>Para:</strong>
                                {{ reminder.recipient_email }}
                            </p>

                            <p>
                                <strong>Fecha:</strong>
                                {{ reminder.sent_at|date:"d/m/Y H:i" }}
                            </p>

                            <p>
                                <strong>Asunto:</strong>
                                {{ reminder.subject }}
                            </p>
                        </div>

                        <div class="border-t border-gray-200 pt-4
                                    dark:border-gray-700">

                            <p class="mb-2 text-sm font-medium
                                    text-gray-900 dark:text-white">
                                Mensaje
                            </p>

                            <div class="whitespace-pre-wrap break-words
                                        rounded-lg bg-gray-50 p-4
                                        text-sm text-gray-700
                                        dark:bg-gray-900 dark:text-gray-300">{{ reminder.message }}</div>

                        </div>

                    </div>

                    <!-- Pie -->
                    <div class="flex justify-end border-t
                                border-gray-200 p-4 dark:border-gray-700">

                        <button
                            type="button"
                            data-modal-hide="reminder-modal-{{ reminder.pk }}"
                            class="rounded-lg bg-gray-200 px-4 py-2
                                text-sm font-medium text-gray-800
                                hover:bg-gray-300
                                dark:bg-gray-700 dark:text-white
                                dark:hover:bg-gray-600"
                        >
                            Cerrar
                        </button>

                    </div>

                </div>
            </div>
        </div>

    {% endfor %}
