
<!-- ================================================= -->
<!-- MODAL DE MENSAJE -->
<!-- ================================================= -->
{% for reminder in collection_reminders %}

    <div
        id="reminder-modal-{{ reminder.pk }}"
        tabindex="-1"
        aria-hidden="true"
        class="fixed inset-0 z-50 hidden h-full w-full
               items-center justify-center overflow-y-auto
               overflow-x-hidden bg-black/60 p-4"
    >

        <div class="relative w-full max-w-2xl">

            <div class="relative rounded-lg border border-gray-200
                        bg-white shadow-xl
                        dark:border-dark-tertiary
                        dark:bg-dark-secondary">

                <!-- Cabecera -->
                <div class="flex items-center justify-between
                            border-b border-gray-200 p-5
                            dark:border-dark-tertiary">

                    <h3 class="text-lg font-semibold
                               text-gray-900 dark:text-white">
                        Recordatorio enviado
                    </h3>

                    <button
                        type="button"
                        data-modal-hide="reminder-modal-{{ reminder.pk }}"
                        class="rounded-lg p-2 text-gray-500
                               transition-colors
                               hover:bg-gray-100 hover:text-gray-900
                               dark:text-gray-400
                               dark:hover:bg-dark-tertiary
                               dark:hover:text-white"
                    >
                        ✕
                        <span class="sr-only">Cerrar modal</span>
                    </button>

                </div>

                <!-- Información -->
                <div class="space-y-4 p-6">

                    <div class="space-y-2 text-sm
                                text-gray-600 dark:text-gray-300">

                        <p>
                            <strong class="text-gray-900 dark:text-white">
                                Para:
                            </strong>
                            {{ reminder.recipient_email }}
                        </p>

                        <p>
                            <strong class="text-gray-900 dark:text-white">
                                Fecha:
                            </strong>
                            {{ reminder.sent_at|date:"d/m/Y H:i" }}
                        </p>

                        <p>
                            <strong class="text-gray-900 dark:text-white">
                                Asunto:
                            </strong>
                            {{ reminder.subject }}
                        </p>

                    </div>

                    <!-- Mensaje -->
                    <div class="border-t border-gray-200 pt-4
                                dark:border-dark-tertiary">

                        <p class="mb-2 text-sm font-medium
                                  text-gray-900 dark:text-white">
                            Mensaje
                        </p>

                        <div class="whitespace-pre-wrap break-words
                                    rounded-lg border border-gray-200
                                    bg-gray-50 p-4
                                    text-sm leading-relaxed text-gray-700
                                    dark:border-dark-tertiary
                                    dark:bg-dark-primary
                                    dark:text-gray-200">{{ reminder.message }}</div>

                    </div>

                </div>

                <!-- Pie -->
                <div class="flex justify-end border-t
                            border-gray-200 p-4
                            dark:border-dark-tertiary">

                    <button
                        type="button"
                        data-modal-hide="reminder-modal-{{ reminder.pk }}"
                        class="rounded-lg bg-btn-primary px-4 py-2
                               text-sm font-medium text-white
                               transition-colors
                               hover:bg-btn-hover-primary"
                    >
                        Cerrar
                    </button>

                </div>

            </div>
        </div>
    </div>

{% endfor %}
