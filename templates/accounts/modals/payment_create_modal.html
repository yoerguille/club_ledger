<!-- ================================================= -->
<!-- MODAL DE REGISTRAR PAGO -->
<!-- ================================================= -->

    {% if not account.is_closed %}

        <div
            id="payment-create-modal"
            tabindex="-1"
            aria-hidden="true"
            class="fixed inset-0 z-50 hidden h-full w-full
                items-center justify-center overflow-y-auto
                overflow-x-hidden bg-gray-900/50 p-4"
        >
            <div class="relative w-full max-w-xl">

                <div class="relative rounded-xl bg-white shadow-lg
                            dark:bg-gray-800">

                    <!-- Cabecera -->
                    <div class="flex items-center justify-between
                                border-b border-gray-200 p-5
                                dark:border-gray-700">

                        <div>
                            <h3 class="text-lg font-semibold
                                    text-gray-900 dark:text-white">
                                Registrar pago
                            </h3>

                            <p class="mt-1 text-sm text-gray-500
                                    dark:text-gray-400">
                                {{ account.customer.name }}
                            </p>
                        </div>

                        <button
                            type="button"
                            data-modal-hide="payment-create-modal"
                            class="rounded-lg p-2 text-gray-400
                                hover:bg-gray-100 hover:text-gray-900
                                dark:hover:bg-gray-700 dark:hover:text-white"
                            aria-label="Cerrar"
                        >
                            ✕
                        </button>
                    </div>

                    <!-- Formulario -->
                    <form
                        id="payment-create-form"
                        data-api-url="{% url 'api_payment_create' account.pk %}"
                    >
                        {% csrf_token %}
                        <div class="space-y-4 p-6">

                            <div>
                                <label for="payment-date"
                                    class="mb-2 block text-sm font-medium
                                            text-gray-900 dark:text-white">
                                    Fecha
                                </label>
                                <input
                                    type="date"
                                    id="payment-date"
                                    name="date"
                                    required
                                    class="block w-full rounded-lg border
                                        border-gray-300 bg-gray-50 p-2.5
                                        text-sm text-gray-900
                                        dark:border-gray-600 dark:bg-gray-700
                                        dark:text-white"
                                >
                            </div>

                            <div>
                                <label for="payment-description"
                                    class="mb-2 block text-sm font-medium
                                            text-gray-900 dark:text-white">
                                    Descripción
                                </label>
                                <input
                                    type="text"
                                    id="payment-description"
                                    name="description"
                                    maxlength="255"
                                    required
                                    class="block w-full rounded-lg border
                                        border-gray-300 bg-gray-50 p-2.5
                                        text-sm text-gray-900
                                        dark:border-gray-600 dark:bg-gray-700
                                        dark:text-white"
                                >
                            </div>

                            <div>
                                <label for="payment-amount"
                                    class="mb-2 block text-sm font-medium
                                            text-gray-900 dark:text-white">
                                    Importe (€)
                                </label>
                                <input
                                    type="number"
                                    id="payment-amount"
                                    name="amount"
                                    min="0.01"
                                    step="0.01"
                                    required
                                    class="block w-full rounded-lg border
                                        border-gray-300 bg-gray-50 p-2.5
                                        text-sm text-gray-900
                                        dark:border-gray-600 dark:bg-gray-700
                                        dark:text-white"
                                >
                            </div>

                            <div>
                                <label for="payment-method"
                                    class="mb-2 block text-sm font-medium
                                            text-gray-900 dark:text-white">
                                    Método de pago
                                </label>

                                <select
                                    id="payment-method"
                                    name="payment_method"
                                    required
                                    class="block w-full rounded-lg border
                                        border-gray-300 bg-gray-50 p-2.5
                                        text-sm text-gray-900
                                        dark:border-gray-600 dark:bg-gray-700
                                        dark:text-white"
                                >
                                    <option value="">Seleccionar método</option>
                                    {% for value, label in payment_methods %}
                                        <option value="{{ value }}">{{ label }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div>
                                <label for="payment-notes"
                                    class="mb-2 block text-sm font-medium
                                            text-gray-900 dark:text-white">
                                    Notas (opcional)
                                </label>

                                <textarea
                                    id="payment-notes"
                                    name="notes"
                                    rows="3"
                                    class="block w-full rounded-lg border
                                        border-gray-300 bg-gray-50 p-2.5
                                        text-sm text-gray-900
                                        dark:border-gray-600 dark:bg-gray-700
                                        dark:text-white"
                                ></textarea>
                            </div>

                        </div>

                        <div
                            id="payment-form-error"
                            role="alert"
                            class="mx-6 hidden rounded-lg bg-red-50 p-3
                                text-sm text-red-700
                                dark:bg-red-900/20 dark:text-red-400"
                        ></div>

                        <!-- Pie -->
                        <div class="flex justify-end gap-3
                                    border-t border-gray-200 p-5
                                    dark:border-gray-700">

                            <button
                                type="button"
                                data-modal-hide="payment-create-modal"
                                class="rounded-lg bg-gray-200 px-4 py-2
                                    text-sm font-medium text-gray-800
                                    hover:bg-gray-300
                                    dark:bg-gray-700 dark:text-white"
                            >
                                Cancelar
                            </button>

                            <button
                                type="submit"
                                id="payment-submit-btn"
                                class="rounded-lg bg-blue-600 px-4 py-2
                                    text-sm font-medium text-white"
                            >
                                Guardar pago
                            </button>

                        </div>

                    </form>

                </div>
            </div>
        </div>

    {% endif %}
