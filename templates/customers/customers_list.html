{% extends "base.html" %}

{% block title %}
Clientes
{% endblock %}

{% block content %}

<h2>Clientes</h2>

<ul>
    {% for customer in customers %}
        <li>
            <a href="{% url 'customers:customer_detail' customer.pk %}">{{customer.name}}</a>
        </li>
    {% empty %}
        <li>No hay clientes</li>
    {% endfor %}
</ul>

{% endblock %}
