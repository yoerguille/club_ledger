<div
    id="customer-edit-modal"
    tabindex="-1"
    aria-hidden="true"
    class="fixed inset-0 z-50 hidden h-full w-full
           items-center justify-center overflow-y-auto
           overflow-x-hidden bg-gray-900/50 p-4"
>
    <div class="relative w-full max-w-xl">

        <div class="relative rounded-xl bg-white shadow-xl
                    dark:bg-dark-primary">

            <!-- Cabecera -->
            <div class="flex items-center justify-between
                        border-b border-gray-200 p-5
                        dark:border-white/10">

                <div>
                    <h3 class="text-lg font-semibold
                               text-gray-900 dark:text-white">
                        Editar cliente
                    </h3>

                    <p class="mt-1 text-sm text-gray-500
                              dark:text-secondary">
                        Modifica los datos del cliente.
                    </p>
                </div>

                <button
                    type="button"
                    data-modal-hide="customer-edit-modal"
                    aria-label="Cerrar"
                    class="rounded-lg p-2 text-gray-400
                           transition-colors
                           hover:bg-gray-100 hover:text-gray-900
                           dark:text-secondary
                           dark:hover:bg-dark-secondary
                           dark:hover:text-white"
                >
                    ✕
                </button>
            </div>

            <!-- Formulario -->
            <form
                id="customer-edit-form"
                method="post"
                action="{% url 'customers:customer_update' customer.pk %}"
            >
                {% csrf_token %}

                <div class="space-y-4 p-6">

                    {% for field in customer_form %}
                        <div>
                            {% include "components/forms/field.html" with field=field %}

                            <p
                                id="edit-{{ field.name }}-error"
                                class="mt-1 hidden text-sm text-red-500"
                            ></p>
                        </div>
                    {% endfor %}

                    <!-- Errores generales -->
                    <div
                        id="customer-edit-form-errors"
                        role="alert"
                        class="hidden rounded-lg bg-red-50 p-3
                               text-sm text-red-700
                               dark:bg-red-900/20
                               dark:text-red-400"
                    ></div>

                </div>

                <!-- Pie -->
                <div class="flex justify-end gap-3
                            border-t border-gray-200 p-5
                            dark:border-white/10">

                    <button
                        type="button"
                        data-modal-hide="customer-edit-modal"
                        class="rounded-lg bg-gray-200 px-4 py-2
                               text-sm font-medium text-gray-800
                               transition-colors hover:bg-gray-300
                               dark:bg-dark-secondary
                               dark:text-gray-200
                               dark:hover:bg-dark-tertiary"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="rounded-lg bg-btn-primary px-4 py-2
                               text-sm font-medium text-white
                               transition-colors
                               hover:bg-btn-hover-primary
                               focus:outline-none
                               focus:ring-2 focus:ring-btn-primary/40
                               disabled:cursor-not-allowed
                               disabled:opacity-50"
                    >
                        Guardar cambios
                    </button>

                </div>
            </form>

        </div>
    </div>
</div>
