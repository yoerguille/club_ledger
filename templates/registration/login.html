{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block page_title %}
    Login
{% endblock %}


{% block content %}

{% load static %}

    <div class="flex min-h-[calc(100vh-64px)] items-center justify-center">

        <div class="w-full max-w-md shrink-0 rounded-2xl bg-white p-8 shadow-sm dark:bg-dark-primary">

            <div class="mb-8 text-center">

                
                <!-- ENCABEZADO DEL LOGIN -->
                <div class="mb-8 flex flex-col items-center">

                    <!-- Logotipo oficial -->
                    <img
                        src="{% static 'img/brand/club-ledger-logo.png' %}"
                        alt="Club Ledger"
                        class="h-12 w-auto max-w-full object-contain"
                    >

                    <!-- Subtítulo -->
                    <p class="mt-4 text-center text-sm text-gray-500
                            dark:text-gray-400">
                        Inicia sesión para continuar
                    </p>

                </div>


            </div>


            <form method="post">

                {% csrf_token %}

                {% if form.errors %}

                    <div class="mb-6 rounded-lg bg-red-50 p-4 text-sm text-red-700 dark:text-gray-400">

                        El usuario o la contraseña no son correctos.

                    </div>

                {% endif %}


                <div class="mb-5">

                    <label
                        for="id_username"
                        class="mb-2 block text-sm font-medium text-gray-700 dark:text-secondary"
                    >
                        Usuario
                    </label>

                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        autocomplete="username"
                        required
                        class="w-full rounded-lg border border-gray-300
                                px-3 py-2.5 text-sm
                                focus:border-btn-primary
                                focus:outline-none
                                focus:ring-2 focus:ring-btn-primary dark:bg-dark-secondary dark:border-gray-700"
                    >

                </div>


                <div class="mb-6">

                    <label
                        for="id_password"
                        class="mb-2 block text-sm font-medium text-gray-700 dark:text-secondary"
                    >
                        Contraseña
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        autocomplete="current-password"
                        required
                        class="w-full rounded-lg border border-gray-300
                                px-3 py-2.5 text-sm
                                focus:border-btn-primary
                                focus:outline-none
                                focus:ring-2 focus:ring-btn-primary dark:bg-dark-secondary dark:border-gray-700"
                    >

                </div>


                <button
                    type="submit"
                    class="w-full rounded-lg bg-btn-primary
                            px-4 py-2.5 text-sm font-medium text-white
                            transition hover:bg-btn-hover-primary
                            focus:outline-none
                            focus:ring-2 focus:ring-btn-primary
                            focus:ring-offset-2"
                >
                    Iniciar sesión
                </button>

            </form>

        </div>

    </div>





{% endblock %}
