{% load static %}
{% load tailwind_tags %}

<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Belgrano&family=Google+Sans:ital,opsz,wght@0,
        17..18,400..700;1,17..18,400..700&family=Onest:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,
        400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,
        400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        
    <script>
        const savedTheme = localStorage.getItem("theme");

        if (savedTheme === "dark") {
            document.documentElement.classList.add("dark");
        }
    </script>

    {% tailwind_css %}
    <meta charset="UTF-8">

    <!-- Tu archivo JS -->
    <script src="{% static 'js/main.js' %}"></script>
    

    <title>

        {% block title %}

        Club Ledger

        {% endblock %}

    </title>

   
</head>


<body class="bg-gradient-to-t from-slate-400 to-slate-50 dark:bg-gradient-to-t dark:from-slate-900 dark:to-slate-500">

    <div class="min-h-screen flex">

        {% include "components/sidebar.html" %}

        <div class="flex-1 flex flex-col">

            {% include "components/navbar.html" %}

            <main class="p-8">

                {% include "components/messages.html" %}

                {% block content %}
                
                {% endblock %}

            </main>

        </div>


    </div>
    {% block extra_js %}

    {% endblock %}
    <script src="{% static 'js/flowbite.min.js' %}"></script>
</body>
</html>
